<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title> Submission Page</title>
    </head>
    <body>
        <form action="index.html">
            <p>Your Recipe Name:
                <input type="text" name="recipe name" size="15" maxlength="30"/>
            </p>
            <p>Ingredients and Instructions:
                <textarea name="Ingredients and Instructions" cols="30" rows="8"> Put Your Ingredients and Instructions Here...</textarea>
            </p>
            <p>Difficulty Level:
                <input type="radio" name="easy" value="rock" checked="checked" /> Easy
                <input type="radio" name="medium" value="rock" checked="checked" /> Medium
                <input type="radio" name="Hard" value="rock" checked="checked" /> Hard
            </p>
            <p>Please Select Any Dietary Preferences that apply to you:
                <input type="checkbox" name="Vegetarian" value="Vegetarian" checked="checked" /> Vegetarian
                <input type="checkbox" name="Vegan" value="Vegan" checked="checked" /> Vegan
                <input type="checkbox" name="Pagan" value="Pagan" checked="checked" /> Pagan
            </p>
            <p>Submit</p>
                <input type="submit" name="submit" value="Submit" />
        </form>
    </body>
</html>
